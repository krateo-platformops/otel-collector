dist:
  name: otelcol-krateo
  description: Krateo OTel Collector – contrib + compositionresolver processor
  output_path: ./otelcol-krateo

receivers:
  # K8s events (watch mode) and cluster metrics
  # k8sobjectsreceiver vendored locally with a krateo patch: the upstream v0.118.0 watch stalls
  # silently (no error/close) when the watch connection dies, hanging events forever. The patched
  # copy re-establishes the watch on a recycle interval and restarts (not stops) on channel close.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sobjectsreceiver v0.118.0
    path: ./k8sobjectsreceiver
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver v0.118.0

processors:
  # Core processors
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.118.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.118.0
  # Contrib processors
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.118.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.118.0
  # Custom: resolves krateo.io/composition-id from involvedObject labels
  - gomod: github.com/krateo-platformops/otel-collector/compositionresolver v0.0.1
    path: ./compositionresolver

exporters:
  # clickhouseexporter vendored locally with a krateo patch: on an insert failing with
  # UNKNOWN_TABLE (code 60) -- i.e. ClickHouse was re-provisioned with a fresh, empty DB while
  # the collector kept running -- recreate the otel_* schema (idempotent) and retry, instead of
  # dropping telemetry until the collector is manually restarted. Upstream PR pending; when it
  # merges + releases, drop the vendored copy + the path: override and bump the gomod version.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.118.0
    path: ./clickhouseexporter
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.118.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.118.0

# OTel Go SDK v1.47.0 under collector core v0.118.0. These reach the module graph OCB generates, which
# is the graph that ships. A floor in a local module's go.mod would not hold for otelzap: `go mod tidy`
# drops a requirement a module does not use, and no local module imports it.
# - contrib/config: vendored at v0.10.0 (the version core v0.118.0 compiles against) with a one-line
#   patch, see contribconfig/resource.go. Unpatched, the collector exits at startup with
#   "conflicting Schema URL" on any otel/sdk >= v1.37.0. Its go.mod also carries the OTLP and stdout
#   exporter floors (GHSA-8wmf-6v46-5gfg, GHSA-w8rr-5gcm-pp58, GHSA-hjf4-fphr-2h65).
# - otelzap: v0.6.0 does not compile against otel/log v1.47.0.
# Drop both when a collector core bump brings these versions on its own.
replaces:
  - go.opentelemetry.io/contrib/config => ../contribconfig
  - go.opentelemetry.io/contrib/bridges/otelzap => go.opentelemetry.io/contrib/bridges/otelzap v0.21.0
